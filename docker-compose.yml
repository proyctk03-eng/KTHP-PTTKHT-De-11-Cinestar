# ========================================================
# DOCKER COMPOSE ORCHESTRATION - DAY 1
# ĐỀ TÀI 11: HỆ THỐNG ĐẶT VÉ XEM PHIM & SỰ KIỆN TRỰC TUYẾN
# SINH VIÊN: NGUYỄN TUẤN ĐẠT - MSV: DTC245200452
# MÔN HỌC: TRIỂN KHAI & QUẢN TRỊ HỆ THỐNG PHẦN MỀM K23 - ICTU
# ========================================================

services:
  # 1. Web Application (Node.js + Express Full-stack)
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: ticket_app
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-ticket_user}
      - DB_PASSWORD=${DB_PASSWORD:-TicketSecurePass2024!}
      - DB_NAME=${DB_NAME:-ticket_db}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 350M

  # 2. Database Server (MySQL 8.0 với chuẩn 3NF và Seed Data)
  mysql:
    image: mysql:8.0
    container_name: ticket_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-RootSecurePass2024!}
      - MYSQL_DATABASE=${DB_NAME:-ticket_db}
      - MYSQL_USER=${DB_USER:-ticket_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-TicketSecurePass2024!}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RootSecurePass2024!}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M

  # 3. Quản trị Cơ sở dữ liệu giao diện Web (phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ticket_phpmyadmin
    restart: unless-stopped
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - UPLOAD_LIMIT=64M
    ports:
      - "${PMA_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # 4. Nginx Reverse Proxy (HTTPS + SSL + Security Headers)
  nginx:
    image: nginx:alpine
    container_name: ticket_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - frontend_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

# ========================================================
# NETWORK ISOLATION (HARDENING BẢO MẬT)
# ========================================================
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

# ========================================================
# PERSISTENT VOLUMES
# ========================================================
volumes:
  mysql_data:
    driver: local
