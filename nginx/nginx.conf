user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Định dạng Log chi tiết phục vụ Promtail & Loki thu thập
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # HARDENING BẢO MẬT: Ẩn thông tin phiên bản Nginx
    server_tokens off;
    client_max_body_size 10M;

    # HARDENING BẢO MẬT: Giới hạn tần suất request (Rate Limiting) chống Brute-force / DDoS
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=booking_limit:10m rate=5r/s;

    # GZIP Nén dữ liệu truyền tải
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Upstreams
    upstream ticket_app {
        server app:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream pma_app {
        server phpmyadmin:80 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # ========================================================
    # 1. CẤU HÌNH HTTP (PORT 80)
    # Tự động chuyển hướng hoặc phục vụ dự phòng
    # ========================================================
    server {
        listen 80;
        server_name localhost;

        # Endpoint Nginx stub_status cho Prometheus Exporter ở Ngày 2
        location /stub_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
            deny all;
        }

        # Chuyển hướng toàn bộ sang HTTPS (Port 443)
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ========================================================
    # 2. CẤU HÌNH HTTPS (PORT 443) - CHỨNG CHỈ SSL TỰ KÝ
    # ========================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        # SSL Certificates
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # SSL Protocols & Ciphers (Hardening)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # HARDENING BẢO MẬT: Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Áp dụng Rate Limit chung
        limit_req zone=general_limit burst=20 nodelay;

        # 1. Reverse Proxy tới Web App Đặt Vé
        location / {
            proxy_pass http://ticket_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }

        # 2. Rate limit chặt chẽ cho API Đặt vé (chống spam đơn ảo)
        location /api/bookings {
            limit_req zone=booking_limit burst=5 nodelay;
            proxy_pass http://ticket_app/api/bookings;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Reverse Proxy tới công cụ quản trị phpMyAdmin
        location /pma/ {
            proxy_pass http://pma_app/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }
}
