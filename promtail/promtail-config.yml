# ========================================================
# CẤU HÌNH PROMTAIL LOG COLLECTOR - BƯỚC 5 -> BƯỚC 6
# HỌC PHẦN: TRIỂN KHAI VÀ QUẢN TRỊ HỆ THỐNG PHẦN MỀM - K23
# SINH VIÊN: NGUYỄN TUẤN ĐẠT - MSV: DTC245200452
# ========================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ========================================================
  # 1. TỰ ĐỘNG THU THẬP LOG QUA DOCKER SERVICE DISCOVERY
  # GÁN NHÃN JOB="NGINX" VÀ JOB="WEBAPP" PHỤC VỤ LOGQL
  # ========================================================
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Lấy tên container từ Docker metadata
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      
      # Gán nhãn job="nginx" cho container Nginx
      - source_labels: ['__meta_docker_container_name']
        regex: '/.*nginx.*'
        target_label: 'job'
        replacement: 'nginx'

      # Gán nhãn job="webapp" cho container Web App
      - source_labels: ['__meta_docker_container_name']
        regex: '/.*(webapp|app).*'
        target_label: 'job'
        replacement: 'webapp'

      # Gán nhãn job="db" cho container Database
      - source_labels: ['__meta_docker_container_name']
        regex: '/.*(db|mysql).*'
        target_label: 'job'
        replacement: 'db'

  # ========================================================
  # 2. THU THẬP TẤT CẢ CONTAINER LOGS TỪ FILE JSON DOCKER
  # ========================================================
  - job_name: container-files
    static_configs:
      - targets:
          - localhost
        labels:
          job: container-logs
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs: attrs
            tag: tag
            time: time
      - regex:
          expression: '(?P<container_name>ticket_[a-zA-Z0-9_-]+|nginx|mysql|webapp|app)'
          source: tag
      - labels:
          stream:
          container_name:
      - output:
          source: output

  # ========================================================
  # 3. THU THẬP TRỰC TIẾP FILE ACCESS & ERROR LOG CỦA NGINX
  # ========================================================
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          container: nginx
          __path__: /var/log/nginx/*.log
