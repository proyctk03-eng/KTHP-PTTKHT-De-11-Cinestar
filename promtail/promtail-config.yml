server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Thu thập toàn bộ log từ các Docker Containers
  - job_name: container-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: container-logs
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs: attrs
            tag: tag
            time: time

      - regex:
          expression: '(?P<container_name>ticket_[a-zA-Z0-9_-]+|nginx|mysql|app)'
          source: tag

      - labels:
          stream:
          container_name:

      - output:
          source: output

  # 2. Thu thập trực tiếp file log Nginx nếu có volume
  - job_name: nginx-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          container: nginx
          __path__: /var/log/nginx/*.log
