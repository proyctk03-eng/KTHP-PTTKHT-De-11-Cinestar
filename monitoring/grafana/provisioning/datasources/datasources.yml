apiVersion: 1

datasources:
  # 1. Nguồn dữ liệu Prometheus tự động kết nối (Bước 4)
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 10s
      httpMethod: POST

  # 2. Nguồn dữ liệu Loki tập trung Log (Chuẩn bị cho Bước 5)
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
