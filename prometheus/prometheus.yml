global:
  scrape_interval: 10s       # Cào dữ liệu mỗi 10 giây
  evaluation_interval: 10s   # Đánh giá cảnh báo mỗi 10 giây
  scrape_timeout: 5s

scrape_configs:
  # 1. Giám sát chính Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Giám sát toàn bộ Docker Container qua cAdvisor (CPU, Memory, Network)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # 3. Giám sát Ứng dụng Web Đặt vé (Node.js Express + prom-client)
  - job_name: 'ticket-booking-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:3000']
    relabel_configs:
      - target_label: application
        replacement: cinema-ticket-system

  # 4. Giám sát Cơ sở dữ liệu MySQL 8.0 qua mysqld-exporter
  - job_name: 'mysql-database'
    static_configs:
      - targets: ['mysqld-exporter:9104']

  # 5. Giám sát Nginx Web Server qua nginx-prometheus-exporter
  - job_name: 'nginx-reverse-proxy'
    static_configs:
      - targets: ['nginx-exporter:9113']
