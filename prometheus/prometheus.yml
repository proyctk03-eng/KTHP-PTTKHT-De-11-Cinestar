global:
  scrape_interval: 10s       # Cào dữ liệu định kỳ mỗi 10 giây
  evaluation_interval: 10s   # Đánh giá cảnh báo mỗi 10 giây
  scrape_timeout: 5s

scrape_configs:
  # 1. Tự giám sát chính Prometheus Server
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Giám sát tài nguyên toàn bộ Docker Containers qua cAdvisor
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # 3. Giám sát Ứng dụng Web Đặt vé (Node.js Express + prom-client)
  - job_name: 'webapp'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['webapp:3000']
    relabel_configs:
      - target_label: application
        replacement: cinema-ticket-system

  # 4. Giám sát Nginx Web Server qua Nginx Exporter
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
